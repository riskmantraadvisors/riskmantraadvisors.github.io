{%- comment -%}
  Google Analytics 4, loaded only after the visitor accepts analytics cookies
  (consent banner in _includes/consent.html). Until then nothing is sent to Google.
{%- endcomment -%}
{%- if site.google_analytics != "" and jekyll.environment == "production" -%}
<script>
  window.RM_GA_ID = '{{ site.google_analytics }}';
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', { analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
  window.rmLoadAnalytics = function () {
    if (window.rmAnalyticsLoaded) return;
    window.rmAnalyticsLoaded = true;
    gtag('consent', 'update', { analytics_storage: 'granted' });
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.RM_GA_ID;
    document.head.appendChild(s);
    gtag('js', new Date());
    gtag('config', window.RM_GA_ID, { anonymize_ip: true });
  };
  try { if (localStorage.getItem('rm-consent') === 'granted') window.rmLoadAnalytics(); } catch (e) {}
</script>
{%- endif -%}
