<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b192c">
{% seo %}
<link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>document.documentElement.classList.remove('no-js');</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": {{ site.legal_name | jsonify }},
  "url": {{ site.url | jsonify }},
  "logo": {{ site.logo | absolute_url | jsonify }},
  "email": {{ site.contact.email | jsonify }},
  "description": {{ site.description | strip | jsonify }},
  "areaServed": "IN",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "1104, G Wing, Kanakia Paris, F Block, Bandra Kurla Complex, Bandra East",
    "addressLocality": "Mumbai",
    "postalCode": "400051",
    "addressCountry": "IN"
  }
}
</script>
{% include analytics.html %}
